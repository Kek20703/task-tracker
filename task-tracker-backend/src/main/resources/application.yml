spring:
  application:
    name: task-tracker-backend
  kafka:
    # Адрес брокера: localhost:29092 — для запуска из IDE, kafka:9092 — из контейнера.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # Потребитель — другой сервис, его DTO здесь нет: тип задаётся настройкой, а не заголовком.
        spring.json.add.type.headers: false
        # Недоступная Kafka не должна задерживать регистрацию.
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:1000}
  datasource:
    # Значения по умолчанию — для запуска из IDE рядом с docker compose.
    # В контейнере переопределяются переменными SPRING_DATASOURCE_URL и т.д.
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:task_tracker}
    username: ${POSTGRES_USER:task_tracker}
    password: ${POSTGRES_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  web:
    resources:
      add-mappings: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8080

springdoc:
  # Swagger UI и описание API. На сервере можно выключить: SWAGGER_ENABLED=false.
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

jwt:
  # Секрет подписи токенов, не короче 32 байт. Задаётся только через окружение.
  secret: ${JWT_SECRET}
  # Срок жизни access token. Refresh token нет, поэтому срок сравнительно длинный.
  ttl: ${JWT_TTL:24h}
