spring:
  application:
    name: task-tracker-summarization-server
  main:
    web-application-type: none
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: task-tracker-summarization-server
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.tasktracker.summarization.dto
        spring.json.value.default.type: com.tasktracker.summarization.dto.SummarizationRequest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${SUMMARIZATION_DB:summarization}
    username: ${POSTGRES_USER:task_tracker}
    password: ${POSTGRES_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

summarization:
  requests-topic: ${SUMMARIZATION_REQUESTS_TOPIC:SUMMARIZATION_REQUESTS}
  responses-topic: ${SUMMARIZATION_RESPONSES_TOPIC:SUMMARIZATION_RESPONSES}

llm:
  base-url: ${LLM_BASE_URL:}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:gpt-4o-mini}
  timeout: ${LLM_TIMEOUT:10s}
