name: CI

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  check:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - task-tracker-backend
          - task-tracker-email-sender
          - task-tracker-summarization-server
          - task-tracker-scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        working-directory: ${{ matrix.service }}
        run: chmod +x gradlew
      - name: Check
        working-directory: ${{ matrix.service }}
        run: ./gradlew --no-daemon check

  frontend:
    name: task-tracker-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-tracker-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: task-tracker-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
